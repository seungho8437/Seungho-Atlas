cle class="d" cx="1267.4" cy="892.7" r="3.2"/><circle class="d" cx="1104.8" cy="819.2" r="3.2"/><text class="l" x="1109.8" y="815.2">BL62</text><circle class="d" cx="1097.6" cy="819.2" r="3.2"/><circle class="d" cx="1018.7" cy="819.2" r="3.2"/><text class="l" x="1023.7" y="815.2">KI4</text><circle class="d" cx="1062.2" cy="819.2" r="3.2"/><circle class="d" cx="1086.9" cy="848.5" r="3.2"/><text class="l" x="1091.9" y="844.5">BL63</text><circle class="d" cx="1096.9" cy="848.4" r="3.2"/><circle class="d" cx="1225.2" cy="876.7" r="3.2"/><text class="l" x="1230.2" y="872.7">GB41</text><circle class="d" cx="1217.8" cy="876.7" r="3.2"/><circle class="d" cx="1242.9" cy="472.2" r="3.2"/><text class="l" x="1247.9" y="468.2">TE3</text><circle class="d" cx="1241.3" cy="471.7" r="3.2"/><circle class="d" cx="1264.1" cy="523.2" r="3.2"/><text class="l" x="1269.1" y="519.2">TE4</text><circle class="d" cx="1261.3" cy="524.3" r="3.2"/><circle class="d" cx="913.7" cy="319.3" r="3.2"/><text class="l" x="918.7" y="315.3">GV9</text><circle class="d" cx="916.9" cy="301.8" r="3.2"/><text class="l" x="921.9" y="297.8">GV10</text><circle class="d" cx="964.0" cy="241.8" r="3.2"/><text class="l" x="969.0" y="237.8">GV13</text><circle class="d" cx="996.6" cy="225.3" r="3.2"/><text class="l" x="1001.6" y="221.3">GV15</text><text x="70" y="970" class="t" style="font-size:22px">Group findings</text><text x="70" y="1010" class="r b">BL35 — accepted-with-model-caveat</text><text x="92" y="1032" class="r">꼬리뼈 끝에서 가쪽 0.5 B-cun: 꼬리뼈/볼기 영역 체표에 있어야 한다.</text><text x="70" y="1058" class="r b">BL36 — accepted-with-model-caveat</text><text x="92" y="1080" class="r">볼기주름 중점: 좌우 볼기 아래 경계 체표에 있어야 한다.</text><text x="70" y="1106" class="r b">GB28 — accepted-with-model-caveat</text><text x="92" y="1128" class="r">ASIS의 안쪽·아래쪽 0.5 B-cun: 하복부-서혜부 경계에 있어야 한다.</text><text x="70" y="1154" class="r b">GB29 — accepted-with-model-caveat</text><text x="92" y="1176" class="r">ASIS-큰돌기 연결선 중점: 가쪽 골반/볼기 영역에 있어야 한다.</text><text x="70" y="1202" class="r b">ST17_GB23 — pass · d=left:0.1413, right:0.1412</text><text x="92" y="1224" class="r">같은 제4늑간 높이지만 GB23이 ST17보다 가쪽이어야 한다.</text><text x="70" y="1250" class="r b">ST43_GB42 — pass · d=left:0.0301, right:0.0432</text><text x="92" y="1272" class="r">GB42(4-5 발허리뼈 사이)가 ST43(2-3 사이)보다 가쪽이어야 한다.</text><text x="70" y="1298" class="r b">BL62_KI4 — pass · d=left:0.0763, right:0.0757</text><text x="92" y="1320" class="r">BL62는 가쪽복사 아래, KI4는 안쪽복사 뒤아래로 분리되어야 한다.</text><text x="70" y="1346" class="r b">BL63_GB41 — pass · d=left:0.0858, right:0.0809</text><text x="92" y="1368" class="r">BL63은 가쪽/뒤쪽 발, GB41은 발등 4-5 발허리뼈 바닥 먼쪽으로 분리되어야 한다.</text><text x="70" y="1394" class="r b">TE3_TE4 — pass · d=left:0.1125, right:0.1158</text><text x="92" y="1416" class="r">TE3은 손허리뼈 사이, TE4는 손목주름으로 손-손목 축에서 분리되어야 한다.</text><text x="70" y="1442" class="r b">GV9_GV10 — pass · d=midline:0.0382</text><text x="92" y="1464" class="r">GV10(T6)가 GV9(T7)보다 위쪽이어야 한다.</text><text x="70" y="1490" class="r b">GV13_GV15 — pass · d=midline:0.0388</text><text x="92" y="1512" class="r">GV15(C2)는 GV13(T1)보다 위쪽이고 GV16보다 아래쪽이어야 한다.</text><text x="70" y="1785" class="s">Global QC: near clusters 0; exact duplicates 0; invalid geometry/laterality 0. Model-level anatomical QC; not cadaveric/imaging validation.</text></svg>