name: Build minimal frozen-B CV1 CV12 patch

on:
  workflow_dispatch:
  push:
    branches:
      - feature/korean-tcm-knowledge
    paths:
      - scripts/build-anatomy-acupoint-relations-v1.0.1-patch.mjs
      - .github/workflows/build-anatomy-acupoint-relations-v1.0.1-patch.yml

permissions:
  contents: write

jobs:
  patch-and-regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/korean-tcm-knowledge
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Build minimal patch and run graph regression
        run: node scripts/build-anatomy-acupoint-relations-v1.0.1-patch.mjs
      - name: Commit patch artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/data/anatomy-acupoint-relations-v1.0.1-patch.json.gz.b64.txt public/knowledge/anatomy-acupoint-relations-v1.0.1-patch-report.json public/knowledge/anatomy-acupoint-relations-v1.0.1-patch-regression.json
          if git diff --cached --quiet; then
            echo "No patch output changes."
          else
            git commit -m "data: patch CV1 CV12 reference-line cardinality"
            git pull --rebase origin feature/korean-tcm-knowledge
            git push origin HEAD:feature/korean-tcm-knowledge
          fi
