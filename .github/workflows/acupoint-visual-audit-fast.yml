name: Acupoint Visual Audit Fast

on:
  workflow_dispatch:
  push:
    branches:
      - feature/korean-tcm-knowledge
    paths:
      - .github/workflows/acupoint-visual-audit-fast.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/korean-tcm-knowledge
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: node scripts/generate-acupoint-visual-audit.mjs
      - name: Upload SVG review artifact
        uses: actions/upload-artifact@v4
        with:
          name: acupoint-visual-audit-fast
          path: artifacts/acupoint-visual-audit
          retention-days: 14
