name: Normalize Anatomy Terminology

on:
  workflow_dispatch:
  push:
    branches:
      - feature/korean-tcm-knowledge
    paths:
      - scripts/normalize-anatomy-terminology.mjs
      - scripts/audit-anatomy-terminology-semantics.mjs
      - .github/workflows/normalize-anatomy-terminology.yml

permissions:
  contents: write

concurrency:
  group: normalize-anatomy-terminology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/korean-tcm-knowledge
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Normalize Korean-English anatomy terminology
        run: node scripts/normalize-anatomy-terminology.mjs
      - name: Semantic terminology audit
        run: node scripts/audit-anatomy-terminology-semantics.mjs
      - run: npm run audit:korean
      - run: npm run check
      - run: npm run build
      - name: Commit normalized terminology data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/knowledge/anatomy-ko.json public/knowledge/kaa-nameko-audit.json public/knowledge/anatomy-terminology-validation-audit.json
          if git diff --cached --quiet; then
            echo "No terminology data changes."
          else
            git commit -m "data: normalize KAA Korean-English anatomy terminology"
            git push
          fi
