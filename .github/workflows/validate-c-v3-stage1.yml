name: Validate C v3 Stage 1 spatial substrate
on:
  workflow_dispatch:
  push:
    branches: [feature/korean-tcm-knowledge]
    paths:
      - 'scripts/cv3/**'
      - '.github/workflows/validate-c-v3-stage1.yml'
permissions:
  contents: read
jobs:
  validate-stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/korean-tcm-knowledge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing atlas integrity baseline
        run: node scripts/validate-atlas.mjs
      - name: Spatial kernel unit tests
        run: python scripts/cv3/test_spatial_core.py
      - name: Build S1 registry
        run: python scripts/cv3/build_s1_registry.py --out .tmp/c-v3-stage1/mesh-registry.json
      - name: Independent G1-A registry audit
        run: python scripts/cv3/validate_g1_registry.py .tmp/c-v3-stage1/mesh-registry.json --report .tmp/c-v3-stage1/g1-a-registry-validation.json
      - name: Independent G1-C skin topology audit
        run: python scripts/cv3/validate_g1_surface_topology.py --report .tmp/c-v3-stage1/g1-c-surface-topology.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c-v3-stage1-validation
          path: .tmp/c-v3-stage1/
          if-no-files-found: error
