name: Validate C v3 Stage 1 spatial substrate
on:
  workflow_dispatch:
  push:
    branches: [feature/korean-tcm-knowledge]
    paths:
      - 'scripts/cv3/**'
      - '.github/workflows/validate-c-v3-stage1.yml'
permissions:
  contents: read
jobs:
  validate-stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/korean-tcm-knowledge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing atlas integrity baseline
        run: node scripts/validate-atlas.mjs
      - name: Spatial kernel unit tests
        run: python scripts/cv3/test_spatial_core.py
      - name: Build S1 canonical mesh registry
        run: python scripts/cv3/build_stage1_registry.py --out .tmp/c-v3-stage1/mesh-registry.json
      - name: Independent registry validation
        run: python scripts/cv3/validate_stage1_registry.py .tmp/c-v3-stage1/mesh-registry.json --report .tmp/c-v3-stage1/registry-validation.json
      - name: Independent skin topology validation
        run: python scripts/cv3/validate_stage1_surface_topology.py --report .tmp/c-v3-stage1/surface-topology-validation.json
      - name: Build Stage 1 spatial substrate
        run: python scripts/cv3/build_stage1_substrate.py --out .tmp/c-v3-stage1/spatial-substrate.json
      - name: Independent frame validation
        run: python scripts/cv3/validate_stage1_frames.py .tmp/c-v3-stage1/spatial-substrate.json --report .tmp/c-v3-stage1/frame-validation.json
      - name: Atlas-backed spatial query validation
        run: python scripts/cv3/validate_stage1_queries.py --substrate .tmp/c-v3-stage1/spatial-substrate.json --report .tmp/c-v3-stage1/query-validation.json
      - name: Render Stage 1 human review
        run: python scripts/cv3/render_stage1_review.py --substrate .tmp/c-v3-stage1/spatial-substrate.json --out .tmp/c-v3-stage1/stage1-review.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c-v3-stage1-validation
          path: .tmp/c-v3-stage1/
          if-no-files-found: error
