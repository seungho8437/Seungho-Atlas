name: Build C v3 S1 body frame and skin regions
on:
  workflow_dispatch:
  push:
    branches: [feature/korean-tcm-knowledge]
    paths:
      - scripts/build-c-v3-s1.py
      - .github/workflows/build-c-v3-s1.yml
permissions:
  contents: write
jobs:
  build-g1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/korean-tcm-knowledge}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build G0a lock and S1 artifacts from native BP3D meshes
        env:
          C_V3_S1_OUT: ${{ github.workspace }}/.tmp/c-v3-s1
        run: python scripts/build-c-v3-s1.py
      - name: Enforce G0a/S1 stop gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.tmp/c-v3-s1')
          lock=json.loads((p/'inputs.lock.json').read_text())
          s=json.loads((p/'g1-summary.json').read_text())
          assert lock['judgment']=='C_V3_G0a_APPROVED'
          assert s['S2_started'] is False
          assert s['status']=='AWAITING_HUMAN_REVIEW'
          assert (p/'skin-regions-review.html').exists()
          PY
      - name: Publish G1 review artifacts only
        run: |
          mkdir -p artifacts/c-v3/g1
          cp .tmp/c-v3-s1/* artifacts/c-v3/g1/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/c-v3/g1
          if git diff --cached --quiet; then
            echo "No G1 artifact changes."
          else
            git commit -m "data: build C v3 G1 body-region review artifacts"
            git pull --rebase origin feature/korean-tcm-knowledge
            git push origin HEAD:feature/korean-tcm-knowledge
          fi
