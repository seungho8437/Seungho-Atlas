name: Build provisional acupoint-coordinate-v2 native solver

on:
  workflow_dispatch:
  push:
    branches:
      - feature/korean-tcm-knowledge
    paths:
      - scripts/build-acupoint-coordinate-v2.mjs
      - scripts/validate-acupoint-coordinate-v2.mjs
      - .github/workflows/build-acupoint-coordinate-v2.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/korean-tcm-knowledge
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Verify frozen B
        run: |
          base64 -d scripts/data/anatomy-acupoint-relations-v1.json.gz.b64.txt | gzip -dc > /tmp/B.json
          echo "6dd00d386a6262d02900ec5a30ea9b18aace899f071159e772c12679740b1d06  /tmp/B.json" | sha256sum -c -
      - name: Build conservative relation-native C v2
        run: node scripts/build-acupoint-coordinate-v2.mjs
      - name: Validate C v2 contract
        run: node scripts/validate-acupoint-coordinate-v2.mjs
      - name: Commit C v2 artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/knowledge/acupoint-bodyparts3d-realization-v2.json public/knowledge/acupoint-coordinate-solver-input-v2.json public/knowledge/acupoint-coordinates-v2.json public/knowledge/acupoint-coordinate-qc-v2.json public/knowledge/acupoint-coordinate-v2-audit-summary.json public/knowledge/acupoint-coordinate-manifest-v2.json
          if git diff --cached --quiet; then
            echo "No v2 changes."
          else
            git commit -m "data: build conservative relation-native acupoint coordinate v2"
            git pull --rebase origin feature/korean-tcm-knowledge
            git push origin HEAD:feature/korean-tcm-knowledge
          fi
